[project]
name = "churn"
version = "0.1.0"
description = "E-commerce customer churn prediction for RetailGenius (EPITA AI PM graded project)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "mlflow>=2.12",
    "shap>=0.45",
    "numba>=0.60",
    "llvmlite>=0.43",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "flake8>=7.0",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
